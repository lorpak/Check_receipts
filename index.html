<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка ошибок БКИ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Обработка ошибок БКИ</h1>
            <p>Автоматическая загрузка и анализ XML файлов</p>
        </header>

        <div class="main-content">
            <!-- Блок выбора локальной папки -->
            <div class="section">
                <h2>Настройки загрузки</h2>
                <div class="input-group">
                    <label for="localFolderPath">Локальная папка для сохранения:</label>
                    <input type="text" id="localFolderPath" placeholder="C:\Путь\для\сохранения\файлов">
                    <button class="btn-primary" onclick="selectLocalFolder()">Выбрать папку</button>
                </div>
            </div>

            <!-- Блок периода обработки -->
            <div class="section">
                <h2>Период обработки</h2>
                <div class="date-range">
                    <h3>Диапазон дат (обязательно)</h3>
                    <div class="date-inputs">
                        <div>
                            <label for="startDate">Начало:</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div>
                            <label for="endDate">Конец:</label>
                            <input type="date" id="endDate" required>
                        </div>
                    </div>
                    <div class="buttons">
                        <button class="btn-secondary" onclick="setToday()">Сегодня</button>
                        <button class="btn-secondary" onclick="setYesterday()">Вчера</button>
                        <button class="btn-secondary" onclick="setLast3Days()">Последние 3 дня</button>
                        <button class="btn-secondary" onclick="clearDates()">Сбросить</button>
                    </div>
                </div>
            </div>

            <!-- Блок типа событий -->
            <div class="section">
                <h2>Тип событий для обработки</h2>
                <div class="event-type">
                    <div class="checkbox-group">
                        <label>
                            <input type="radio" name="eventType" value="all" checked>
                            Все события
                        </label>
                        <label>
                            <input type="radio" name="eventType" value="3-2">
                            События 3.2
                        </label>
                        <label>
                            <input type="radio" name="eventType" value="daily">
                            Ежедневные события
                        </label>
                    </div>
                </div>
            </div>

            <!-- Блок управления -->
            <div class="section">
                <h2>Управление обработкой</h2>
                <div class="control-buttons">
                    <button class="btn-primary" onclick="downloadFiles()">Скачать файлы с сервера</button>
                    <button class="btn-success" id="processBtn" onclick="startProcessing()">Обработать файлы</button>
                    <button class="btn-danger" onclick="clearResults()">Очистить результаты</button>
                </div>
                
                <!-- Прогресс-бар -->
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
            </div>

            <!-- Блок результатов -->
            <div class="section" id="resultsSection" style="display: none;">
                <h2>Результаты обработки</h2>
                <div id="statusMessage"></div>
                <div id="resultFiles" class="file-list"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
